# Compare local models on one fixed task with a real Ollama (https://ollama.com).
# Requires: `ollama serve` running, and the models pulled (`ollama pull llama3.2:3b`).
# One sample is one pass over every prompt, in nanoseconds per generated token (lower is better).

[suite]
name = "local models, summary task"

[[bench]]
id = "llama3-2-3b"
title = "llama3.2:3b"
model = "llama3.2:3b"
num_predict = 128
runs = 7
prompts = [
  "Summarise in two sentences: A backup you have never restored is a hope, not a backup.",
  "List three risks of storing pay records only in a browser.",
]

[[bench]]
id = "llama3-2-1b"
title = "llama3.2:1b"
model = "llama3.2:1b"
num_predict = 128
runs = 7
prompts = [
  "Summarise in two sentences: A backup you have never restored is a hope, not a backup.",
  "List three risks of storing pay records only in a browser.",
]
